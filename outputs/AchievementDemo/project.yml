name: AchievementDemo
options:
  bundleIdPrefix: local.prototype
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: NO
targets:
  AchievementDemo:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - project.yml
          - README.md
          - '*.xcodeproj'
          - Info.plist
          - Fonts
      - path: Fonts/Onest.ttf
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Мастер оценок
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [Onest.ttf]
        UIUserInterfaceStyle: Light
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.prototype.AchievementDemo
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
